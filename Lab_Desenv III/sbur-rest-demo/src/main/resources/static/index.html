<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerenciar Times</title>
</head>
<body>
<h1>Buscar Time</h1>
<input id="teamInput" type="text" placeholder="Digite o nome do time" />
<button onclick="searchTeam()">Buscar</button>

<h2>Adicionar Novo Time</h2>
<input id="newTeamInput" type="text" placeholder="Novo time" />
<button onclick="addTeam()">Adicionar</button>

<h2>Atualizar Nome do Time</h2>
<input id="oldTeamInput" type="text" placeholder="Nome atual" />
<input id="updatedTeamInput" type="text" placeholder="Novo nome" />
<button onclick="updateTeam()">Atualizar</button>

<h2>Remover Time</h2>
<input id="deleteTeamInput" type="text" placeholder="Nome do time a remover" />
<button onclick="deleteTeam()">Remover</button>

<br><br>
<img id="teamImage" src="" alt="Imagem do time" style="max-width:400px; display:none;">
<p id="errorMessage" style="color:red;"></p>
<p id="successMessage" style="color:green;"></p>

<script src="script.js"></script>
</body>
</html>
